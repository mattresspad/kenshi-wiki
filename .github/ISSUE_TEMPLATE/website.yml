name: Website issue or suggestion
description: Report a problem or suggest a change to the layout, navigation, or tools.
body:
  - type: input
    id: page
    attributes:
      label: Where on the site?
      description: Give a page address or name the feature.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happens, and what would you like to see?
      description: For a bug, include the steps you took. Screenshots and browser details are welcome.
