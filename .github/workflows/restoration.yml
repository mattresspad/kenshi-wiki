name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: wiki-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Select and explain coverage
        run: |
          npm run ci:plan
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('reports/ci/plan.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'WIKI_CI_BUILD='+p.build+'\nWIKI_CI_EDITING='+p.editing+'\n');"
      - name: Install browser
        if: env.WIKI_CI_BUILD == 'true'
        run: npm exec -- playwright install --with-deps chromium
      - name: Build the site
        if: env.WIKI_CI_BUILD == 'true'
        run: npm run ci:check -- --phase build
      - name: Check identities, routes and catalog
        run: npm run ci:check -- --phase catalog
      - name: Check browser behavior
        if: env.WIKI_CI_BUILD == 'true'
        run: npm run ci:check -- --phase browser
      - name: Check production packaging
        if: env.WIKI_CI_BUILD == 'true'
        run: npm run ci:check -- --phase package
      - name: Check local editing controls
        if: env.WIKI_CI_EDITING == 'true'
        run: npm run ci:check -- --phase editing
      - name: Summarize results
        if: always()
        run: npm run ci:check -- --phase summary
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr-checks-${{ github.sha }}
          retention-days: 14
          path: |
            reports/ci
            reports/release
            reports/utilities/search-coverage.json
            test-results
