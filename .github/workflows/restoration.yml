name: FreshWiki validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main SHA to rehearse (no deployment)
        required: true
        type: string
permissions:
  contents: read
jobs:
  check-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: freshwiki-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WIKI_EXPECTED_SHA: ${{ inputs.expected_sha }}
      WIKI_CANDIDATE_BRANCH: main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - name: Check the proposed change
        if: github.event_name == 'pull_request'
        run: npm run ci:check
      - name: Rehearse the exact merged candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:check
      - name: Routine diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && github.event_name == 'pull_request'
        with:
          name: freshwiki-check-${{ github.sha }}
          retention-days: 14
          path: |
            reports/release
            reports/routes.json
            reports/route-report.md
            reports/work-coverage.json
            reports/gaps
            reports/utilities/search-coverage.json
            test-results
      - name: Release package and evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: freshwiki-release-${{ github.sha }}
          retention-days: 90
          include-hidden-files: true
          path: |
            .cloudflare/output
            reports/release
            reports/routes.json
            reports/route-report.md
            reports/work-coverage.json
            reports/gaps
            reports/utilities/search-coverage.json
            test-results
