name: FreshWiki candidate
on:
  push:
    branches: [rebuild/restoration, integration/pr-44-code-mod-hooks]
  pull_request:
    branches: [rebuild/restoration]
permissions:
  contents: read
jobs:
  check-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: freshwiki-check-${{ github.ref }}
      cancel-in-progress: true
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WIKI_CANDIDATE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run release:check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: freshwiki-${{ github.sha }}-${{ github.event_name }}
          retention-days: 90
          include-hidden-files: true
          path: |
            .cloudflare/output
            dist
            reports/release
            reports/routes.json
            reports/route-report.md
            reports/work-coverage.json
            reports/gaps
            reports/utilities/search-coverage.json
            test-results
  staging:
    needs: check-and-stage
    if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: restoration-staging
      url: ${{ steps.upload.outputs.url }}
    concurrency:
      group: freshwiki-staging
      cancel-in-progress: false
    env:
      WIKI_RELEASE_TARGET: staging
      WIKI_EDIT_BRANCH: rebuild/restoration
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: freshwiki-${{ github.sha }}-push
          path: .
      - run: npm exec -- playwright install --with-deps chromium
      - name: Upload the checked isolated staging package
        id: upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run release:stage
      - name: Verify the immutable HTTPS version
        env:
          WIKI_PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: npm run release:verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: freshwiki-staging-${{ github.sha }}
          retention-days: 90
          path: |
            reports/release
            test-results
