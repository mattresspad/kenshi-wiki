name: Recheck live deployment
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing active production Worker version
        required: true
        type: string
      source_sha:
        description: Exact source commit recorded on that Worker version
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Recheck live site (no deployment)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify existing live version without publishing
        env:
          WIKI_VERSION: ${{ inputs.version }}
          WIKI_EXPECTED_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run release:recheck
      - name: Save read-only verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: live-recheck-${{ inputs.version }}-${{ github.run_id }}
          retention-days: 90
          path: |
            reports/release
            test-results/release-smoke
